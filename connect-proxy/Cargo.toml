[package]
name = "connect-proxy"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
git-policy = { path = "../git-policy" }
http-body-util = "0.1"
httparse = "1.10"
hyper = { version = "1.7", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1.48", default-features = false, features = ["macros", "net", "rt", "signal", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"

[dev-dependencies]
git-policy = { path = "../git-policy", features = ["test-upstreams"] }
flate2 = "1.1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
