[package]
name = "read-only-git"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
git-policy = { path = "../git-policy" }
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1.7", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1.0"
tokio = { version = "1.48", default-features = false, features = ["macros", "net", "rt", "signal", "time"] }

[dev-dependencies]
git-policy = { path = "../git-policy", features = ["test-upstreams"] }
tokio = { version = "1.48", default-features = false, features = ["io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
