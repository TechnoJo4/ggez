[package]
name = "inference"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
host-runtime = { path = "../host-runtime", features = ["http"] }
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1.7", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[dev-dependencies]
tokio = { version = "1.48", default-features = false, features = ["test-util", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
