# FIRECRACKER_VSOCK_UDS_PATH is the full host path to Firecracker's uds_path;
# FIRECRACKER_VSOCK_UDS_DIR is its parent directory. HOST_BRIDGE_UDS_DIR holds
# the SSH and tame RPC client sockets. These directories must already exist.
# Use GATEWAY_UID/GID matching Firecracker (outbound gateway sockets are 600).
# Bridge sockets are 660; host clients need that group and directory traversal.
# Mount directories, so socket creation/recreation is visible across processes.
x-gateway: &gateway
  user: "${GATEWAY_UID:-65532}:${GATEWAY_GID:-65532}"
  read_only: true

x-firecracker-sockets: &firecracker-sockets
  type: bind
  source: "${FIRECRACKER_VSOCK_UDS_DIR:?set Firecracker's host socket directory}"
  target: "${FIRECRACKER_VSOCK_UDS_DIR:?set Firecracker's host socket directory}"
  bind:
    create_host_path: false

x-bridge-sockets: &bridge-sockets
  type: bind
  source: "${HOST_BRIDGE_UDS_DIR:?set the host client socket directory}"
  target: "${HOST_BRIDGE_UDS_DIR:?set the host client socket directory}"
  bind:
    create_host_path: false

x-guest-bridge: &guest-bridge
  # Set ggez.guest-tcp-port only to generate a guest vsock -> TCP adapter.
  <<: *gateway
  image: ggez-guest-bridge
  build:
    context: .
    dockerfile: guest-bridge/Dockerfile
    network: host
    entitlements:
      - network.host
  network_mode: none
  volumes:
    - <<: *firecracker-sockets
      read_only: true
    - *bridge-sockets

services:
  ssh-bridge:
    <<: *guest-bridge
    image: ggez-guest-bridge
    command:
      - --guest-listener-vsock-port
      - "22"
      - --host-firecracker-vsock-uds
      - "${FIRECRACKER_VSOCK_UDS_PATH:?set Firecracker's full host uds_path}"
      - --host-bridge-listener-uds
      - "${HOST_BRIDGE_UDS_DIR}/ssh.sock"

  dsh-bridge:
    <<: *guest-bridge
    image: ggez-guest-bridge
    labels:
      ggez.guest-tcp-port: "3080"
    command:
      - --guest-listener-vsock-port
      - "3080"
      - --host-firecracker-vsock-uds
      - "${FIRECRACKER_VSOCK_UDS_PATH:?set Firecracker's full host uds_path}"
      - --host-bridge-listener-uds
      - "${HOST_BRIDGE_UDS_DIR}/dsh.sock"

  inference:
    <<: *gateway
    image: ggez-inference
    build:
      context: .
      dockerfile: inference/Dockerfile
      network: host
      entitlements:
        - network.host
    command:
      - --host-inference-listener-uds
      - "${FIRECRACKER_VSOCK_UDS_PATH:?set Firecracker's full host uds_path}_5001"
      - --host-upstreams-config
      - /config.json
    volumes:
      - *firecracker-sockets
      - ./inference/config.json:/config.json:ro
    secrets:
      - opencode_go_key
      - deepseek_key

  read-only-git:
    <<: *gateway
    image: ggez-read-only-git
    build:
      context: .
      dockerfile: read-only-git/Dockerfile
      network: host
      entitlements:
        - network.host
    command:
      - --host-git-listener-uds
      - "${FIRECRACKER_VSOCK_UDS_PATH:?set Firecracker's full host uds_path}_5003"
      - --host-upstreams-config
      - /config.json
    volumes:
      - *firecracker-sockets
      - ./read-only-git/config.json:/config.json:ro

  connect-proxy:
    <<: *gateway
    image: ggez-connect-proxy
    build:
      context: .
      dockerfile: connect-proxy/Dockerfile
      network: host
      entitlements:
        - network.host
    network_mode: host
    command:
      - --host-proxy-listener-uds
      - "${FIRECRACKER_VSOCK_UDS_PATH:?set Firecracker's full host uds_path}_5004"
      - --host-upstreams-config
      - /config.json
      - --host-ca-certificate
      - /ca.crt
      - --host-ca-signing-key
      - /run/secrets/proxy_ca_key
    volumes:
      - *firecracker-sockets
      - ./connect-proxy/config.json:/config.json:ro
      - ./connect-proxy/ca.crt:/ca.crt:ro
    secrets:
      - proxy_ca_key

secrets:
  proxy_ca_key:
    file: ./secrets/ca.key
  opencode_go_key:
    file: ./secrets/opencode_go_key
  deepseek_key:
    file: ./secrets/deepseek_key
